# Mosquitto Broker Configuration for OpenClaw Swarm
# Optimized for Raspberry Pi 2B with <10MB RAM footprint (HARD-02)
# Per RESEARCH.md Pitfall 5: Broker Resource Exhaustion on Pi 2B

# ==============================================================================
# Memory Limits
# ==============================================================================

# Maximum memory usage for the broker (HARD-02 requirement)
# Mosquitto 2.0.x on Pi 2B should stay under 10MB
memory_limit 10M

# Maximum number of messages queued for disconnected clients
# Prevents memory buildup from offline agents
max_queued_messages 100

# Maximum number of concurrent connections
# Set to -1 (no limit) for 4-agent swarm - safe given small scale
max_connections -1

# ==============================================================================
# Logging
# ==============================================================================

# Log to stderr (container-friendly, can be redirected)
log_dest stderr

# Error level logging
log_type error

# Warning level logging
log_type warning

# Disable info/debug to reduce log overhead (optional, uncomment to disable)
# log_type information
# log_type debug

# ==============================================================================
# Socket Optimization
# ==============================================================================

# IPv4 only - reduces memory footprint for single-stack deployment
# Pi 2B doesn't need IPv6 overhead in isolated swarm network
socket_domain ipv4

# ==============================================================================
# Persistence (Optional)
# ==============================================================================

# Persistence disabled by default to save disk I/O on Pi 2B
# Retained messages provide sufficient crash recovery for Phase 1
# Enable later if offline message queueing is needed

# persistence false
# autosave_interval 1800
# autosave_on_changes false

# ==============================================================================
# Security (Future Enhancement)
# ==============================================================================

# Authentication not yet implemented - Phase 1 assumes trusted network
# Future: Add listener + allow_anonymous false for ACL-based auth

# listener 1883
# allow_anonymous true
# password_file /etc/mosquitto/passwd

# ==============================================================================
# Performance Tuning for Pi 2B
# ==============================================================================

# Reduce per-connection overhead
# 4 agents x ~2 connections each = minimal footprint
max_keepalive 65535

# Disable expensive features not needed for 4-agent swarm
# set_tcp_nodelay true  # Default: true, reduces latency
